[package]
name = "nrctool"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
